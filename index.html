const best=(ex,cats)=>{const c=R.map((r,i)=>[r,i]).filter(([r,i])=>!ex.includes(i)&&!r.i.some(k=>S.dis.includes(k))&&!bad(r)).map(([r,i])=>[score(r,cats),i]).sort((a,b)=>b[0]-a[0])[0];return c?c[1]:null};
function gen(){const m=[];for(let x=0;x<S.n;x++){const i=best(m,m.map(j=>R[j].c));if(i!==null)m.push(i)}S.menu=m;S.done=[];S.moved=[];S.store=null;save();render()}
function swap(x){const o=S.menu.filter((_,j)=>j!==x),i=best(S.menu,o.map(j=>R[j].c));if(i!==null){S.menu[x]=i;save();render()}}
const cost=r=>r.i.reduce((a,k)=>a+unit(k)*S.p,0);
const deals=r=>r.i.filter(k=>!C[k].pa).map(k=>{const s=bestS(k),d=DS[s][k];return d?`<span class="tag">${C[k].n} −${Math.round(d*100)}% ${s}</span>`:''}).join('');
const dif=['makkelijk','gemiddeld','pittig'];
function setN(k,d,lo,hi){S[k]=Math.min(hi,Math.max(lo,S[k]+d));save();render()}
function tog(arr,v){const a=S[arr],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);save();render()}
function go(t){S.tab=t;render();scrollTo(0,0)}
function vMenu(){let h=`<h1>Weekmenu</h1><p class="sub">${SRC}</p>
<div class="card"><div class="row"><span class="sp">Diners</span><span class="step"><button class="rb" onclick="setN('n',-1,1,7)" aria-label="Minder diners">−</button><b>${S.n}</b><button class="rb" onclick="setN('n',1,1,7)" aria-label="Meer diners">+</button></span></div>
<div class="row" style="margin:10px 0"><span class="sp">Personen</span><span class="step"><button class="rb" onclick="setN('p',-1,1,10)" aria-label="Minder personen">−</button><b>${S.p}</b><button class="rb" onclick="setN('p',1,1,10)" aria-label="Meer personen">+</button></span></div>
<button class="btn" onclick="gen()">${S.menu.length?'Maak nieuw weekmenu':'Maak weekmenu'}</button></div>`;
if(!S.menu.length)return h+`<p class="sub">Kies je diners en personen en tik op de knop.</p>`;
let t=0;S.menu.forEach((i,x)=>{const r=R[i],c=cost(r);t+=c;h+=`<div class="card"><div class="row"><div class="pic">${EM[r.c]}</div><div class="sp"><div class="name">${r.n}</div><div class="meta">${r.m} min, ${dif[r.d-1]}</div><div><b>${eur(c)}</b> <span class="meta">totaal, ${eur(c/S.p)} p.p.</span></div></div>
<div style="display:grid;gap:6px"><button class="ghost" onclick="tog('favs','${r.n}')" aria-label="Favoriet">${S.favs.includes(r.n)?'❤️':'🤍'}</button><button class="ghost" onclick="swap(${x})" aria-label="Wissel gerecht">↻</button></div></div>${deals(r)}</div>`});
return h+`<div class="card row"><span class="sp">Hele week</span><b>${eur(t)}</b></div><button class="btn" onclick="S.hist.unshift({d:new Date().toLocaleDateString('nl-NL'),m:S.menu.map(i=>R[i].n),n:S.n,p:S.p});S.hist=S.hist.slice(0,20);save();alert('Bewaard in je geschiedenis')">Bewaar deze week</button>`}
function vShop(){if(!S.menu.length)return `<h1>Boodschappen</h1><p class="sub">Maak eerst een weekmenu.</p>`;
const bs=cheapest(),u=uses(),ks=Object.keys(u);
let h=`<h1>Boodschappen</h1><div class="seg"><button class="${S.mode==='single'?'on':''}" onclick="S.mode='single';save();render()">Één winkel</button><button class="${S.mode==='split'?'on':''}" onclick="S.mode='split';save();render()">Verdeeld</button></div>`;
if(S.mode==='single'){h+=`<div class="row" style="flex-wrap:wrap;gap:8px">`+ST.map(s=>`<button class="st ${s===cur()?'sel':''}" onclick="S.store='${s}';save();render()">${s}<b>${eur(tot(s))}</b>${s===bs?'<span class="best">goedkoopst</span>':''}</button>`).join('')+`</div>`}
else h+=`<div class="card row"><span class="sp">Goedkoopste per product</span><b>${eur(tot('split'))}</b></div><p class="sub">Je bespaart ${eur(tot(bs)-tot('split'))} t.o.v. alleen ${bs}.</p>`;
h+=`<h2>Te kopen</h2><div class="card">`;
const row=(k,buy)=>{const n=u[k],st=S.mode==='split'?bestS(k):cur();return `<div class="it ${S.done.includes(k)&&buy?'d':''}">${buy?`<input type="checkbox" ${S.done.includes(k)?'checked':''} onchange="tog('done','${k}')" aria-label="${C[k].n}">`:''}<div class="t"><b>${C[k].n}</b> <span class="meta">${qty(k,n)}${buy?`, ${eur(pr(k,st)*S.p*n)}${S.mode==='split'?' bij '+st:''}`:''}</span></div><button class="ghost" onclick="tog('moved','${k}')">${buy?'Heb ik':'Koop'}</button></div>`};
h+=ks.filter(isBuy).map(k=>row(k,1)).join('')||'<p class="meta">Niets te kopen.</p>';
h+=`</div><h2>Waarschijnlijk in huis</h2><div class="card">`+(ks.filter(k=>!isBuy(k)).map(k=>row(k,0)).join('')||'<p class="meta">Leeg.</p>')+`</div>`;return h}
function vMe(){let h=`<h1>Ik</h1><h2>Lust ik niet</h2><p class="sub">Typ een woord (bijvoorbeeld ‘zalm’) of tik een ingrediënt aan. Geblokkeerde gerechten komen niet in je menu.</p><div class="card"><div class="row"><input id="dw" class="in" placeholder="Wat lust je niet?" onkeydown="if(event.key==='Enter')addDw()"><button class="ghost" onclick="addDw()">Voeg toe</button></div><div>${S.dw.map(w=>`<button class="chip on" onclick="rmDw('${w}')">${w} ✕</button>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line)">`;
h+=Object.keys(C).filter(k=>!C[k].pa).map(k=>`<button class="chip ${S.dis.includes(k)?'on':''}" onclick="tog('dis','${k}')">${C[k].n}</button>`).join('')+`</div><h2>Favorieten</h2><div class="card">`;
h+=S.favs.map(f=>`<span class="chip">❤️ ${f}</span>`).join('')||'<p class="meta">Tik op het hartje bij een gerecht.</p>';
h+=`</div><h2>Geschiedenis</h2>`+(S.hist.map(x=>`<div class="card"><b>${x.d}</b> <span class="meta">${x.n} diners, ${x.p} pers.</span><div class="meta">${x.m.join(', ')}</div></div>`).join('')||'<p class="meta">Nog geen bewaarde weken.</p>');return h+vAdd()}
const bad2=0;
function addDw(){const v=document.getElementById('dw').value.trim().toLowerCase();if(v&&!S.dw.includes(v)){S.dw.push(v);save();render()}}
function rmDw(w){S.dw=S.dw.filter(x=>x!==w);save();render()}
const selIng=k=>{const a=S.form.sel,i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);render()};
function addIng(){const n=S.form.ni;if(!n.n.trim())return;const k='c_'+Date.now();S.ci[k]={n:n.n.trim(),p:+n.p||0.3,u:n.u,q:+n.q||1,pa:0};C[k]=S.ci[k];S.form.sel.push(k);S.form.ni={n:'',p:'',u:'g',q:''};save();render()}
function saveCr(){const f=S.form;if(!f.n.trim()||!f.sel.length){alert('Geef een naam en kies minstens één ingrediënt');return}const r={n:f.n.trim(),c:f.c,m:f.m||30,d:f.d,i:[...f.sel]};S.cr.push(r);R.push(r);S.form={open:false,n:'',c:'Overig',m:30,d:1,sel:[],ni:{n:'',p:'',u:'g',q:''}};save();render()}
function delCr(x){S.cr.splice(x,1);R.length=BASE;S.cr.forEach(r=>R.push(r));S.menu=S.menu.filter(i=>i<R.length);save();render()}
function vAdd(){const f=S.form;let h=`<h2>Eigen recepten</h2>`+S.cr.map((r,x)=>`<div class="card row"><span class="sp"><b>${r.n}</b> <span class="meta">${r.c}, ${r.m} min</span></span><button class="ghost" onclick="delCr(${x})" aria-label="Verwijder">✕</button></div>`).join('');
if(!f.open)return h+`<button class="btn" onclick="S.form.open=true;render()">+ Nieuw recept</button>`;
return h+`<div class="card"><input class="in" placeholder="Naam van het gerecht" value="${f.n}" oninput="S.form.n=this.value"><div class="row" style="margin:8px 0"><select class="in" onchange="S.form.c=this.value">${Object.keys(EM).map(c=>`<option ${c===f.c?'selected':''}>${c}</option>`).join('')}</select><input class="in" type="number" min="5" value="${f.m}" oninput="S.form.m=+this.value" aria-label="Minuten"><select class="in" onchange="S.form.d=+this.value">${dif.map((d,i)=>`<option value="${i+1}" ${i+1===f.d?'selected':''}>${d}</option>`).join('')}</select></div><p class="meta">Kies ingrediënten:</p><div style="max-height:200px;overflow:auto">${Object.keys(C).map(k=>`<button class="chip ${f.sel.includes(k)?'on':''}" onclick="selIng('${k}')">${C[k].n}</button>`).join('')}</div><p class="meta">Staat het er niet bij? Voeg het toe (prijs per persoon en hoeveelheid per persoon):</p><div class="row"><input class="in" placeholder="Naam" value="${f.ni.n}" oninput="S.form.ni.n=this.value"><input class="in" type="number" step="0.05" placeholder="€ p.p." value="${f.ni.p}" oninput="S.form.ni.p=this.value"><select class="in" onchange="S.form.ni.u=this.value"><option>g</option><option>st</option><option>ml</option></select><input class="in" type="number" placeholder="p.p." value="${f.ni.q}" oninput="S.form.ni.q=this.value"></div><button class="ghost" style="margin:8px 0" onclick="addIng()">Ingrediënt toevoegen</button><button class="btn" onclick="saveCr()">Recept opslaan</button></div>`}
function render(){app.innerHTML=S.tab==='menu'?vMenu():S.tab==='shop'?vShop():vMe();app.innerHTML+=`<p class="meta" style="text-align:center;margin-top:24px">Aanbiedingen via <a href="https://www.prijsprofeet.nl" style="color:inherit">PrijsProfeet</a></p>`;
nav.innerHTML=[['menu','🍽️','Menu'],['shop','🛒','Boodschappen'],['me','👤','Ik']].map(([t,e,l])=>`<button class="${S.tab===t?'on':''}" onclick="go('${t}')"><span>${e}</span>${l}</button>`).join('')}
render();
fetch('deals.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{const d={};ST.forEach(s=>{d[s]={};Object.entries((j.stores||{})[s]||{}).forEach(([k,v])=>d[s][k]=v.d)});DS=d;SRC='Aanbiedingen van '+j.updated+'.';render()}).catch(()=>{});
</script></body></html>
