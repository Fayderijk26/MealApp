name: Weekaanbiedingen ophalen
on:
  schedule:
    - cron: "0 5 * * 1,4"   # maandag en donderdag, 05:00 UTC
  workflow_dispatch:         # handmatig starten via de knop "Run workflow"
permissions:
  contents: write
jobs:
  deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aanbiedingen ophalen
        env:
          PP_API_KEY: ${{ secrets.PP_API_KEY }}
        run: python scripts/fetch_deals.py
      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "deals-update"
          git config user.email "actions@users.noreply.github.com"
          git add deals.json
          git diff --staged --quiet || (git commit -m "Aanbiedingen bijgewerkt" && git push)
